name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Debug token permissions
        run: |
          RESULT=$(curl -s -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/comibrand00-stack/alooy | \
            python3 -c "import json,sys; d=json.load(sys.stdin); import sys; sys.stdout.write('permissions: ' + json.dumps(d.get('permissions',{})) + '; pushable: ' + str(d.get('pushable')) + '; message: ' + str(d.get('message')))")
          echo "::notice::$RESULT"
          curl -s -o /dev/null -w "%{http_code}\n" -X PUT \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/comibrand00-stack/alooy/contents/debug-test.txt \
            -d '{"message":"test","content":"dGVzdA=="}' | while IFS= read -r line; do echo "::notice::contents+write probe: HTTP $line"; done

      - name: Prepares executable
        run: chmod +x $GITHUB_WORKSPACE/src/gradlew

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 $GITHUB_WORKSPACE/builds/plugins.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          ./gradlew make makePluginsJson --stacktrace
          cp **/build/*.cs3 $GITHUB_WORKSPACE/builds
          cp build/plugins.json $GITHUB_WORKSPACE/builds

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          set +e
          OUTPUT=$(git push --force 2>&1)
          PUSH_EXIT=$?
          set -e
          echo "$OUTPUT"
          if [ $PUSH_EXIT -ne 0 ]; then
            echo "$OUTPUT" | while IFS= read -r line; do echo "::error::$line"; done
          fi
          exit $PUSH_EXIT