name: Build

concurrency:
  group: "build"
  cancel-in-progress: true

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - '*.md'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: "src"

      - name: Prepares executable
        run: chmod +x $GITHUB_WORKSPACE/src/gradlew

      - name: Checkout builds
        uses: actions/checkout@v4
        with:
          ref: "builds"
          path: "builds"

      - name: Clean old builds
        run: rm -f $GITHUB_WORKSPACE/builds/*.cs3 $GITHUB_WORKSPACE/builds/plugins.json

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 17

      - name: Build Plugins
        run: |
          cd $GITHUB_WORKSPACE/src
          ./gradlew make makePluginsJson --stacktrace > /tmp/gradle.log 2>&1 || true
          grep -E "^e: " /tmp/gradle.log | head -n 30 | while IFS= read -r line; do echo "::error::$line"; done
          tail -n 5 /tmp/gradle.log
          if grep -q "BUILD SUCCESSFUL" /tmp/gradle.log; then
            cp **/build/*.cs3 $GITHUB_WORKSPACE/builds 2>/dev/null || true
            cp build/plugins.json $GITHUB_WORKSPACE/builds 2>/dev/null || true
          fi
          exit 0

      - name: Push builds
        run: |
          cd $GITHUB_WORKSPACE/builds
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit --amend -m "Build $GITHUB_SHA" || exit 0
          git push --force